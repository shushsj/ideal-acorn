<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>官方界面 放心访问</title>
    <style>
        /* 全局基础：冰冰制作 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Comic Sans MS", "Microsoft YaHei", sans-serif;
        }
        body, html {
            height: 100%;
            overflow: hidden;
            background: linear-gradient(120deg, #ffedf9 0%, #e6f7ff 100%);
        }
        /* 1. 正常加载场景：居中布局 */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .loading-container.hidden {
            opacity: 0;
            pointer-events: none;
        }
        /* 加载页LOGO */
        .loading-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            background: url("data:image/svg+xml,%3Csvg xmlns='https://pb.nichi.co/prepare-short-ladder/2000/svg' viewBox='0 0 80 80'%3E%3Ccircle cx='40' cy='40' r='38' fill='%23ffd1dc' stroke='%23ff6b9e' stroke-width='2'/%3E%3Cpath d='M25 35 L55 35 M35 25 L35 55 M45 25 L45 55' stroke='%23ff6b9e' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='40' cy='40' r='8' fill='%23ff6b9e'/%3E%3C/svg%3E") no-repeat center;
            background-size: contain;
        }
        .loading-title {
            font-size: 20px;
            color: #ff6b9e;
            margin-bottom: 20px;
            text-shadow: 0 1px 3px rgba(255,107,158,0.2);
        }
        .loading-text {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
        }
        /* 静态加载条 */
        .tech-loader {
            width: 200px;
            height: 10px;
            background: rgba(255,255,255,0.7);
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 0 8px rgba(255,107,158,0.2);
        }
        .loader-bar {
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, #ff6b9e, #4ecdc4);
            border-radius: 5px;
        }
        /* 2. 异常跳转场景：重新布局的萌系卡片 */
        .jump-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
        }
        .jump-card {
            background: rgba(255,255,255,0.95);
            padding: 35px 25px;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 18px rgba(255,107,158,0.2);
            border: 2px solid #ffd1dc;
        }
        /* 新增：异常页LOGO（在标题上方） */
        .jump-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: url("data:image/svg+xml,%3Csvg xmlns='https://pb.nichi.co/prepare-short-ladder/2000/svg' viewBox='0 0 80 80'%3E%3Ccircle cx='40' cy='40' r='38' fill='%23ffe6f2' stroke='%23ff6b9e' stroke-width='2'/%3E%3Cpath d='M30 30 L50 50 M50 30 L30 50' stroke='%23ff6b9e' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='40' cy='40' r='10' fill='%23ff6b9e'/%3E%3C/svg%3E") no-repeat center;
            background-size: contain;
        }
        .jump-card h3 {
            font-size: 22px;
            color: #ff6b9e;
            margin-bottom: 15px;
        }
        .error-desc {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        /* 联系按钮（替换文字，改为跳转按钮） */
        .contact-btn {
            display: inline-block;
            width: 80%;
            padding: 12px 0;
            background: linear-gradient(90deg, #4ecdc4, #88d8c0);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(78,205,196,0.3);
            transition: transform 0.2s ease;
        }
        .contact-btn:hover {
            transform: translateY(-2px);
        }
        .countdown-box {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }
        .countdown {
            color: #ff6b9e;
            font-size: 22px;
            font-weight: bold;
            margin: 0 5px;
        }
        /* 跳转首页按钮 */
        .home-btn {
            width: 100%;
            padding: 13px 0;
            background: linear-gradient(90deg, #ff6b9e, #ff9ff3);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(255,107,158,0.3);
            transition: transform 0.2s ease;
        }
        .home-btn:hover {
            transform: translateY(-2px);
        }
        /* iframe基础样式 */
        #embeddedPage {
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #embeddedPage.loaded {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- 嵌入页面的iframe -->
    <iframe id="embeddedPage" src=""></iframe>
    <!-- 正常加载场景：含LOGO的居中布局 -->
    <div class="loading-container" id="loadingTip">
        <div class="loading-logo"></div>
        <div class="loading-title">官方通道</div>
        <div class="loading-text">正在建立连接...</div>
        <div class="tech-loader">
            <div class="loader-bar"></div>
        </div>
    </div>
    <script>
        // 1. 配置参数（可自定义修改）
        const jumpTarget = "https://qm.qq.com/cgi-bin/qm/qr?k=1961339945"; // 自动跳转首页地址
        const contactTarget = "https://qm.qq.com/cgi-bin/qm/qr?k=453268015"; // QQ联系链接（需自行生成）
        const jumpDelay = 5; // 自动跳转延迟（秒）
        let jumpTimer = null;

        // 2. 核心逻辑：URL参数获取
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // 修复后的Base64解码函数：支持标准Base64和Base64 URL安全编码，解决解码乱码问题
        function decodeBase64Url(encodedUrl) {
            try {
                // 步骤1：适配Base64 URL安全编码（将-替换为+，_替换为/）
                const standardBase64 = encodedUrl.replace(/-/g, '+').replace(/_/g, '/');
                // 步骤2：Base64解码（atob返回二进制字符串）
                const decodedBinary = atob(standardBase64);
                // 步骤3：将二进制字符串转为UTF-8编码的正常URL（避免中文/特殊字符乱码）
                const utf8Array = new Uint8Array(decodedBinary.length);
                for (let i = 0; i < decodedBinary.length; i++) {
                    utf8Array[i] = decodedBinary.charCodeAt(i);
                }
                // 步骤4：解码为最终URL字符串
                return new TextDecoder('utf-8').decode(utf8Array);
            } catch (e) {
                // 解码失败（如非法编码、长度错误）返回null
                return null;
            }
        }

        // 3. 异常场景：含LOGO和联系按钮的跳转卡片
        function createJumpTip() {
            document.getElementById('loadingTip').classList.add('hidden');
            
            const jumpContainer = document.createElement('div');
            jumpContainer.className = 'jump-container';
            jumpContainer.innerHTML = `
                <div class="jump-card">
                    <div class="jump-logo"></div>
                    <h3>冰@TGBBhxzc886</h3>
                    <p class="error-desc">连接防红异常，请联系冰冰处理</p>
                    <a href="${contactTarget}" target="_blank" class="contact-btn">联系冰冰</a>
                    <div class="countdown-box">
                        将在 <span class="countdown">${jumpDelay}</span> 秒后自动返回首页
                    </div>
                    <button class="home-btn" onclick="window.location.href='${jumpTarget}'">
                        立即返回首页
                    </button>
                </div>
            `;
            document.body.appendChild(jumpContainer);

            // 倒计时逻辑
            let remainTime = jumpDelay;
            const countdownEl = jumpContainer.querySelector('.countdown');
            jumpTimer = setInterval(() => {
                remainTime--;
                countdownEl.textContent = remainTime;
                if (remainTime <= 0) {
                    clearInterval(jumpTimer);
                    window.location.href = jumpTarget;
                }
            }, 1000);
        }

        // 4. 主逻辑：场景判断
        const encodedUrl = getQueryParam('bing');
        const loadingTip = document.getElementById('loadingTip');
        const iframe = document.getElementById('embeddedPage');

        if (encodedUrl) {
            const decodedUrl = decodeBase64Url(encodedUrl);
            // 验证解码后的URL是否为合法http/https链接
            if (decodedUrl && (decodedUrl.startsWith('http://') || decodedUrl.startsWith('https://'))) {
                iframe.src = decodedUrl;
                // iframe加载成功：隐藏加载页，显示内容
                iframe.onload = () => {
                    loadingTip.classList.add('hidden');
                    iframe.classList.add('loaded');
                };
                // iframe加载失败（如跨域、链接无效）：触发异常卡片
                iframe.onerror = () => createJumpTip();
            } else {
                // 解码后URL非法：触发异常卡片
                createJumpTip();
            }
        } else {
            // 未传bing参数：触发异常卡片
            createJumpTip();
        }
    </script>
</body>
</html>
